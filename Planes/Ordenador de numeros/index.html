<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenador de Numeros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>The Chosen One organizes the numbers</h1>
    
    <div class="controles">
        <label for="cantidad">Casillas:</label>
        <input type="number" id="cantidad" value="5" min="3" max="10">
    </div>
    
    <div id="lienzo">
        <div id="botones">
            <button id="btn-ordenar">Ordenar</button>
            <button id="btn-restart">Restart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
